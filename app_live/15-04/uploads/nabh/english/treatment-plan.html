<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Treatment Plan</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f3f3f3;
    }

    /* A4 page container */
    .page {
      min-height: 297mm;
      margin: 10mm auto;
      background: #fff;
      padding: 18mm 0;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin: 0 0 28px 0;
      text-transform: capitalize;
    }

    .info-row {
      display: flex;
      gap: 40px;
      margin-bottom: 16px;
    }

    .info-group {
      display: flex;
      align-items: flex-end;
      flex: 1;
      min-width: 0;
    }

    .label {
      white-space: nowrap;
      margin-right: 10px;
      font-weight: normal;
      font-size: 14px;
    }

    /* underline line */
    .line {
      border-bottom: 1px solid #000;
      flex: 1;
      height: 22px;
      position: relative;
      min-width: 60px;
    }

    /* Input exactly on line */
    .input-overlay {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 20px;
      border: none;
      outline: none;
      background: transparent;
      font-family: Arial, sans-serif;
      font-size: 14px;
      padding: 0 2px;
      margin: 0;
      line-height: 20px;
    }

    .section-label {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      margin: 18px 0 8px;
    }

    .section-label .line {
      height: 24px;
    }

    p {
      margin: 16px 0 6px;
      font-size: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 10px 0 18px;
      table-layout: fixed; /* PDF safe */
    }

    th, td {
      border: 1px solid #000;
      padding: 0; /* we'll handle padding in input */
      height: 36px;
      position: relative;
      vertical-align: middle;
      font-size: 14px;
    }

    th {
      padding: 8px 10px;
      font-weight: bold;
      background: #fff;
    }

    .col-sr { width: 12%; }
    .col-date { width: 25%; }
    .col-plan { width: 63%; }

    /* Table input - NO transform */
    td .input-overlay {
      position: absolute;
      left: 10px;
      top: 8px;
      width: calc(100% - 20px);
      height: 20px;
      line-height: 20px;
    }

    .footer-row {
      display: flex;
      gap: 50px;
      margin-top: 35px;
    }

    .submit-bar {
      margin: 0 auto 20px;
      max-width: 210mm;
      background: #fff;
      padding: 12px 15mm;
      border-top: 1px solid #ddd;
    }

    /* Print */
    @media print {
      body { background: none; }
      .page {
        margin: 0;
        width: 210mm;
        min-height: 297mm;
        padding: 18mm 15mm;
      }
      .submit-bar { display: none !important; }

      @page {
        size: A4;
        margin: 10mm; /* important: don't use 0 for PDF engines */
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <h1>Treatment plan</h1>

    <div class="info-row">
      <div class="info-group">
        <span class="label">UHID No.</span>
        <div class="line"><input type="text" id="input1" name="input1" class="input-overlay" /></div>
      </div>

      <div class="info-group">
        <span class="label">Name of the patient:</span>
        <div class="line"><input type="text" id="patient_name" name="patient_name" class="input-overlay" /></div>
      </div>
    </div>

    <div class="info-row">
      <div class="info-group">
        <span class="label">Age/Sex:</span>
        <div class="line"><input type="text" id="input3" name="input3" class="input-overlay" /></div>
      </div>

      <div class="info-group">
        <span class="label">Consultant name:</span>
        <div class="line"><input type="text" id="input4" name="input4" class="input-overlay" /></div>
      </div>
    </div>

    <div class="info-row" style="gap: 0;">
      <div class="info-group" style="max-width: 45%;">
        <span class="label">Date:</span>
        <div class="line"><input type="text" id="today_date" name="today_date" class="input-overlay" /></div>
      </div>
    </div>

    <div class="section-label">
      <span class="label">Chief complain:</span>
      <div class="line"><input type="text" id="input6" name="input6" class="input-overlay" /></div>
    </div>

    <div class="section-label">
      <span class="label">Diagnosis:</span>
      <div class="line"><input type="text" id="input7" name="input7" class="input-overlay" /></div>
    </div>

    <p>Treatment plan</p>

    <table>
      <thead>
        <tr>
          <th class="col-sr">Sr. No.</th>
          <th class="col-date">Date</th>
          <th class="col-plan">Plan of care</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><input type="text" id="input8" name="input8" class="input-overlay" /></td>
          <td><input type="text" id="input9" name="input9" class="input-overlay" /></td>
          <td><input type="text" id="input10" name="input10" class="input-overlay" /></td>
        </tr>
        <tr>
          <td><input type="text" id="input11" name="input11" class="input-overlay" /></td>
          <td><input type="text" id="input12" name="input12" class="input-overlay" /></td>
          <td><input type="text" id="input13" name="input13" class="input-overlay" /></td>
        </tr>
        <tr>
          <td><input type="text" id="input14" name="input14" class="input-overlay" /></td>
          <td><input type="text" id="input15" name="input15" class="input-overlay" /></td>
          <td><input type="text" id="input16" name="input16" class="input-overlay" /></td>
        </tr>
        <tr>
          <td><input type="text" id="input17" name="input17" class="input-overlay" /></td>
          <td><input type="text" id="input18" name="input18" class="input-overlay" /></td>
          <td><input type="text" id="input19" name="input19" class="input-overlay" /></td>
        </tr>
        <tr>
          <td><input type="text" id="input20" name="input20" class="input-overlay" /></td>
          <td><input type="text" id="input21" name="input21" class="input-overlay" /></td>
          <td><input type="text" id="input22" name="input22" class="input-overlay" /></td>
        </tr>
        <tr>
          <td><input type="text" id="input23" name="input23" class="input-overlay" /></td>
          <td><input type="text" id="input24" name="input24" class="input-overlay" /></td>
          <td><input type="text" id="input25" name="input25" class="input-overlay" /></td>
        </tr>
        <tr>
          <td><input type="text" id="input26" name="input26" class="input-overlay" /></td>
          <td><input type="text" id="input27" name="input27" class="input-overlay" /></td>
          <td><input type="text" id="input28" name="input28" class="input-overlay" /></td>
        </tr>
      </tbody>
    </table>

    <div class="section-label">
      <span class="label">Expected result:</span>
      <div class="line"><input type="text" id="input29" name="input29" class="input-overlay" /></div>
    </div>

    <div class="section-label">
      <span class="label">Remarks if any:</span>
      <div class="line"><input type="text" id="input30" name="input30" class="input-overlay" /></div>
    </div>

    <div class="footer-row">
      <div class="info-group">
        <span class="label">Name of the consultant doctor:</span>
        <div class="line"><input type="text" id="input31" name="input31" class="input-overlay" /></div>
      </div>

      <div class="info-group">
        <span class="label">Signature of doctor:</span>
        <div class="line">
          <img name="doctor_signature_image" id="doctor_signature_image" alt="Doctor Signature" style="width:180px;height:70px;" class="line-input w-50" />

          <input type="text" id="input32" name="input32" class="input-overlay" /></div>
      </div>
    </div>
  </div>

  <!-- Submit bar (hidden in print) -->
  <div class="submit-bar">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
      <div style="font-size:12px; color:#444;">
        <strong>Status:</strong> <span id="saveStatus">Not saved</span>
      </div>
      <button id="submitBtn" type="button"
        style="background:#2563eb; color:#fff; border:none; padding:10px 18px; border-radius:6px; cursor:pointer;">
        Submit
      </button>
    </div>
  </div>
</body>
</html>
